name: ts-small
hardware: null
model:
  vocab_size: 8192
  d_model: 384
  n_layers: 8
  n_heads: 6
  n_kv_heads: null
  ffn_mult: 2.6666666666666665
  seq_len: 512
  slots:
    position: rope
    attention: mha
    norm: rmsnorm
    mlp: swiglu
    block: standard
    head: tied
  toggles: {}
train:
  optimizer: adamw
  lr: 0.002
  min_lr_ratio: 0.1
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  schedule: cosine
  warmup_steps: 200
  max_tokens: 200000000
  micro_batch: 32
  grad_accum: 2
  grad_clip: 1.0
  precision: auto
  seed: 1337
  compile: false
  log_every_steps: 10
  eval_every_steps: 250
  eval_batches: 20
  checkpoint_every_steps: 500
  checkpoint_every_min: null
  keep_last: 2
  time_limit_min: null
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.005
    gap_window: 5
    stop_on_gap: false
  divergence:
    enabled: true
    spike_sigma: 6.0
    window: 100
    max_rollbacks: 3
    lr_backoff: 0.5
data:
  source: roneneldan/TinyStories
  split: train
  text_field: text
  tokenizer:
    type: train
    size: 8192
    name: null
  val_fraction: 0.005
